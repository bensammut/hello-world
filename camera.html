<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  video { position: fixed; left: -9999px; top: -9999px; width: 2px; height: 2px; }
  canvas {
    max-width: 92vw;
    max-height: 72vh;
    border-radius: 8px;
    background: #111;
    transform: scaleX(-1); /* mirror, like a selfie cam */
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  select, button {
    background: #1a1a1a;
    color: #fff;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { background: #262626; }
  #status {
    font-size: 13px;
    color: #888;
    min-height: 1.2em;
  }
  #status.error { color: #ff6b6b; }
  #hint {
    font-size: 12px;
    color: #555;
    margin: 0;
  }
  #debug {
    font-size: 11px;
    color: #444;
    font-family: ui-monospace, monospace;
    margin: 0;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <select id="devices"></select>
    <button id="toggle">Stop</button>
    <button id="resetColors">Reset eyes</button>
  </div>
  <p id="status">Requesting camera access…</p>
  <p id="hint">Wink one eye to change its colour — wink again to cycle.</p>
  <p id="debug"></p>

<script type="module">
import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

var video = document.getElementById('video');
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var select = document.getElementById('devices');
var toggle = document.getElementById('toggle');
var resetColors = document.getElementById('resetColors');
var status = document.getElementById('status');
var debug = document.getElementById('debug');

var stream = null;
var rafId = null;
var faceLandmarker = null;
var cameraReady = false;
var modelReady = false;
var modelError = null;
var flashUntil = 0;
var flashText = '';

var PALETTE = ['#3fa9f5', '#3ecf8e', '#a259ff', '#ffb648', '#ff5c8a', '#4dd0e1'];
// Absolute closed-eye score, and how much higher it must be than the other
// eye's score, to count as a wink rather than a symmetric blink or noise.
// Kept low and unsmoothed so the colour flips the instant the wink starts,
// not once it's fully committed.
var BLINK_THRESHOLD = 0.32;
var WINK_MARGIN = 0.12;
// MediaPipe's own left/right eye naming (subject's perspective), matching the
// blendshape categories below — this is the opposite of what a mirrored viewer sees.
var EYES = {
  left: { center: 468, ring: [469, 470, 471, 472], blink: 'eyeBlinkLeft', other: 'eyeBlinkRight', closed: false, colorIdx: -1, score: 0, gx: null, gy: null, gr: null },
  right: { center: 473, ring: [474, 475, 476, 477], blink: 'eyeBlinkRight', other: 'eyeBlinkLeft', closed: false, colorIdx: -1, score: 0, gx: null, gy: null, gr: null }
};

function setStatus(msg, isError) {
  status.textContent = msg;
  status.classList.toggle('error', !!isError);
}

function updateStatus() {
  if (!cameraReady) return;
  if (modelError) { setStatus('Live (wink detection unavailable: ' + modelError + ')', true); return; }
  setStatus(modelReady ? 'Live' : 'Live (loading face model…)');
}

function categoryScore(categories, name) {
  for (var i = 0; i < categories.length; i++) {
    if (categories[i].categoryName === name) return categories[i].score;
  }
  return 0;
}

function smooth(prev, next, alpha) {
  return prev == null ? next : prev + (next - prev) * alpha;
}

function applyWinks(categories) {
  EYES.left.score = categoryScore(categories, 'eyeBlinkLeft');
  EYES.right.score = categoryScore(categories, 'eyeBlinkRight');

  ['left', 'right'].forEach(function (key) {
    var eye = EYES[key];
    var other = EYES[key === 'left' ? 'right' : 'left'];
    var closedNow = eye.score > BLINK_THRESHOLD;
    var wink = closedNow && !eye.closed && (eye.score - other.score) > WINK_MARGIN;
    if (wink) {
      eye.colorIdx = (eye.colorIdx + 1) % PALETTE.length;
      flashText = (key === 'left' ? 'Left' : 'Right') + ' eye → ' + PALETTE[eye.colorIdx];
      flashUntil = performance.now() + 1200;
    }
    eye.closed = closedNow;
  });

  debug.textContent = 'L ' + EYES.left.score.toFixed(2) + '  R ' + EYES.right.score.toFixed(2) +
    (performance.now() < flashUntil ? '  — ' + flashText : '');
}

function drawIris(landmarks, eye, w, h) {
  var c = landmarks[eye.center];
  var cx = c.x * w, cy = c.y * h;
  var r = 0;
  eye.ring.forEach(function (i) {
    var dx = landmarks[i].x * w - cx, dy = landmarks[i].y * h - cy;
    r += Math.sqrt(dx * dx + dy * dy);
  });
  r = (r / eye.ring.length) * 1.06; // hug the actual iris boundary, not the sclera

  // Smooth the geometry across frames so the tint doesn't jitter with landmark noise.
  eye.gx = smooth(eye.gx, cx, 0.6);
  eye.gy = smooth(eye.gy, cy, 0.6);
  eye.gr = smooth(eye.gr, r, 0.6);

  if (eye.colorIdx < 0) return;

  var gradient = ctx.createRadialGradient(eye.gx, eye.gy, eye.gr * 0.55, eye.gx, eye.gy, eye.gr);
  gradient.addColorStop(0, PALETTE[eye.colorIdx]);
  gradient.addColorStop(0.85, PALETTE[eye.colorIdx]);
  gradient.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.save();
  ctx.globalCompositeOperation = 'color';
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(eye.gx, eye.gy, eye.gr, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function renderFrame() {
  rafId = requestAnimationFrame(renderFrame);
  if (video.readyState < 2 || !video.videoWidth) return;

  if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (modelReady && faceLandmarker) {
    var result = faceLandmarker.detectForVideo(video, performance.now());
    var landmarks = result.faceLandmarks && result.faceLandmarks[0];
    var blendshapes = result.faceBlendshapes && result.faceBlendshapes[0];
    if (landmarks && blendshapes) {
      applyWinks(blendshapes.categories);
      drawIris(landmarks, EYES.left, canvas.width, canvas.height);
      drawIris(landmarks, EYES.right, canvas.width, canvas.height);
    }
  }
}

function loadModel() {
  FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm')
    .then(function (filesetResolver) {
      var options = {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
          delegate: 'GPU'
        },
        outputFaceBlendshapes: true,
        runningMode: 'VIDEO',
        numFaces: 1
      };
      return FaceLandmarker.createFromOptions(filesetResolver, options).catch(function () {
        options.baseOptions.delegate = 'CPU';
        return FaceLandmarker.createFromOptions(filesetResolver, options);
      });
    })
    .then(function (landmarker) {
      faceLandmarker = landmarker;
      modelReady = true;
      updateStatus();
    })
    .catch(function (err) {
      modelError = err.message || String(err);
      updateStatus();
    });
}

function stopStream() {
  if (!stream) return;
  stream.getTracks().forEach(function (t) { t.stop(); });
  stream = null;
  cameraReady = false;
}

function start(deviceId) {
  stopStream();
  var constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : true, audio: false };
  navigator.mediaDevices.getUserMedia(constraints).then(function (s) {
    stream = s;
    video.srcObject = s;
    return video.play();
  }).then(function () {
    cameraReady = true;
    toggle.textContent = 'Stop';
    updateStatus();
    return navigator.mediaDevices.enumerateDevices();
  }).then(function (devices) {
    if (!devices) return;
    var cams = devices.filter(function (d) { return d.kind === 'videoinput'; });
    select.innerHTML = '';
    cams.forEach(function (d, i) {
      var opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || ('Camera ' + (i + 1));
      select.appendChild(opt);
    });
    if (deviceId) select.value = deviceId;
  }).catch(function (err) {
    setStatus(err.name + ': ' + err.message, true);
  });
}

select.addEventListener('change', function () {
  start(select.value);
});

toggle.addEventListener('click', function () {
  if (stream) {
    stopStream();
    toggle.textContent = 'Start';
    setStatus('Stopped');
  } else {
    start(select.value);
  }
});

resetColors.addEventListener('click', function () {
  EYES.left.colorIdx = -1;
  EYES.right.colorIdx = -1;
});

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  setStatus('This browser does not support camera access.', true);
} else {
  start();
  loadModel();
  renderFrame();
}
</script>
</body>
</html>
