<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<style>
  :root {
    --cell: clamp(4.2px, 1.3vw, 15px);
    --dim: #808080;
    --hot: #ffffff;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000;
    color: var(--hot);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--cell) * 3);
    overflow: hidden;
    cursor: crosshair;
  }
  #lines { display: flex; flex-direction: column; align-items: center; gap: calc(var(--cell) * 2); }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    grid-auto-rows: var(--cell);
  }
  .cell {
    perspective: calc(var(--cell) * 14);
    transform: scale(calc(1 + var(--t, 0) * 0.75));
    transition: transform .45s cubic-bezier(.2,.8,.3,1);
    will-change: transform;
  }
  .flip {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,1.4,.5,1);
    transition-delay: calc((1 - var(--t, 0)) * 90ms);
  }
  .cell.on .flip { transform: rotateY(180deg); }
  .flip i {
    grid-area: 1 / 1;
    font-style: normal;
    line-height: 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .sym {
    font-family: Wingdings, "Wingdings 2", "Zapf Dingbats", sans-serif;
    font-size: calc(var(--cell) * 1.05);
    color: var(--dim);
  }
  .ltr {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: calc(var(--cell) * 0.88);
    font-weight: 700;
    color: var(--hot);
    transform: rotateY(180deg);
    text-shadow: 0 0 calc(var(--cell) * 1.1) rgba(255,255,255,.5);
  }
  #hint {
    margin: 0;
    font-size: clamp(10px, 1.1vw, 13px);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #3a3a3a;
    transition: opacity .8s ease;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>
  <div id="lines"></div>
  <p id="hint">hover the letters</p>

<script>
(function () {
  // 5x7 bitmap font — only the characters this page needs.
  var FONT = {
    'H': ['#...#','#...#','#...#','#####','#...#','#...#','#...#'],
    'E': ['#####','#....','#....','####.','#....','#....','#####'],
    'L': ['#....','#....','#....','#....','#....','#....','#####'],
    'O': ['.###.','#...#','#...#','#...#','#...#','#...#','.###.'],
    'B': ['####.','#...#','#...#','####.','#...#','#...#','####.'],
    'N': ['#...#','##..#','#.#.#','#.#.#','#..##','#...#','#...#'],
    'S': ['.####','#....','#....','.###.','....#','....#','####.'],
    'A': ['.###.','#...#','#...#','#####','#...#','#...#','#...#'],
    'M': ['#...#','##.##','#.#.#','#.#.#','#...#','#...#','#...#'],
    'U': ['#...#','#...#','#...#','#...#','#...#','#...#','.###.'],
    'T': ['#####','..#..','..#..','..#..','..#..','..#..','..#..'],
    'I': ['#####','..#..','..#..','..#..','..#..','..#..','#####'],
    ',': ['.....','.....','.....','.....','..##.','..##.','.#...'],
    ' ': ['.....','.....','.....','.....','.....','.....','.....']
  };

  var LINES = ['HELLO,', 'I AM BEN'];

  // Per-letter fallback for machines without Wingdings, A-Z.
  var DINGBATS = '✁✂✃✄✆✇✈✉✌✍✎✏' +
                 '✐✑✒✓✔✕✖✗✘✙✚✛✜✝';

  function hasWingdings() {
    var s = document.createElement('span');
    s.style.cssText = 'position:absolute;visibility:hidden;font-size:96px;white-space:pre';
    s.textContent = 'WWWWMMMMlliii';
    document.body.appendChild(s);
    s.style.fontFamily = 'monospace';
    var base = s.offsetWidth;
    s.style.fontFamily = 'Wingdings, monospace';
    var test = s.offsetWidth;
    s.remove();
    return test !== base;
  }

  var wing = hasWingdings();
  var host = document.getElementById('lines');
  var hint = document.getElementById('hint');
  var grids = [];

  function symbolFor(ch) {
    if (wing) return ch;
    var i = ch.charCodeAt(0) - 65;
    return i >= 0 && i < 26 ? DINGBATS.charAt(i) : ch;
  }

  LINES.forEach(function (text) {
    var chars = text.split('');

    // Every letter is filled with the word it belongs to, cycled.
    var wordOf = [];
    var start = 0;
    chars.forEach(function (ch, i) {
      if (ch !== ' ') return;
      var w = text.slice(start, i).replace(/[^A-Z]/g, '');
      for (var k = start; k < i; k++) wordOf[k] = w;
      wordOf[i] = '';
      start = i + 1;
    });
    var tail = text.slice(start).replace(/[^A-Z]/g, '');
    for (var k = start; k < chars.length; k++) wordOf[k] = tail;

    var cols = chars.length * 6 - 1;
    var grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.setProperty('--cols', cols);

    var cells = [];
    var counters = chars.map(function () { return 0; });

    for (var r = 0; r < 7; r++) {
      cells[r] = [];
      for (var c = 0; c < cols; c++) {
        var gi = Math.floor(c / 6), gx = c % 6;
        var rows = FONT[chars[gi]] || FONT[' '];
        if (gx > 4 || rows[r][gx] !== '#') { cells[r][c] = null; continue; }

        var word = wordOf[gi] || 'HELLO';
        var plain = word.charAt(counters[gi]++ % word.length);

        var cell = document.createElement('span');
        cell.className = 'cell';
        cell.style.gridArea = (r + 1) + ' / ' + (c + 1);

        var flip = document.createElement('span');
        flip.className = 'flip';

        var sym = document.createElement('i');
        sym.className = 'sym';
        sym.textContent = symbolFor(plain);

        var ltr = document.createElement('i');
        ltr.className = 'ltr';
        ltr.textContent = plain;

        flip.appendChild(sym);
        flip.appendChild(ltr);
        cell.appendChild(flip);
        grid.appendChild(cell);
        cells[r][c] = cell;
      }
    }
    host.appendChild(grid);
    grids.push({ el: grid, cells: cells, cols: cols, rect: null, size: 0 });
  });

  function measure() {
    grids.forEach(function (g) {
      g.rect = g.el.getBoundingClientRect();
      g.size = g.rect.width / g.cols;
    });
  }
  measure();
  addEventListener('resize', measure);
  addEventListener('scroll', measure, { passive: true });

  var RADIUS = 4.2; // in cells
  var active = new Set();
  var pointer = null;
  var queued = false;
  var discovered = false;

  function paint() {
    queued = false;
    var next = new Set();

    if (pointer) {
      grids.forEach(function (g) {
        if (!g.size) return;
        var cx = (pointer.x - g.rect.left) / g.size;
        var cy = (pointer.y - g.rect.top) / g.size;
        var c0 = Math.floor(cx - RADIUS), c1 = Math.ceil(cx + RADIUS);
        var r0 = Math.floor(cy - RADIUS), r1 = Math.ceil(cy + RADIUS);

        for (var r = Math.max(0, r0); r <= Math.min(6, r1); r++) {
          for (var c = Math.max(0, c0); c <= Math.min(g.cols - 1, c1); c++) {
            var cell = g.cells[r][c];
            if (!cell) continue;
            var dx = (c + 0.5) - cx, dy = (r + 0.5) - cy;
            var t = 1 - Math.sqrt(dx * dx + dy * dy) / RADIUS;
            if (t <= 0.12) continue;
            cell.style.setProperty('--t', t.toFixed(3));
            cell.classList.add('on');
            next.add(cell);
            if (!discovered) {
              discovered = true;
              hint.classList.add('gone');
            }
          }
        }
      });
    }

    active.forEach(function (cell) {
      if (!next.has(cell)) {
        cell.classList.remove('on');
        cell.style.setProperty('--t', 0);
      }
    });
    active = next;
  }

  function onMove(e) {
    var p = e.touches ? e.touches[0] : e;
    pointer = { x: p.clientX, y: p.clientY };
    if (!queued) { queued = true; requestAnimationFrame(paint); }
  }

  addEventListener('pointermove', onMove, { passive: true });
  addEventListener('touchmove', onMove, { passive: true });
  addEventListener('pointerleave', function () {
    pointer = null;
    if (!queued) { queued = true; requestAnimationFrame(paint); }
  });
})();
</script>
</body>
</html>
